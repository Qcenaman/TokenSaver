name: mobile
# MobileTokenSaver (mobile/): tests + APK on every push; on main, when appVersionName
# has no mobile-vX.Y.Z tag yet, publish that release with the APK.
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**']
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: mobile
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: mobile/tunnel/go.mod
          cache-dependency-path: mobile/tunnel/go.mod
      - name: Go tests (tunnel)
        working-directory: mobile/tunnel
        run: |
          go mod tidy
          go vet ./...
          go test ./...
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - id: v
        name: Name the APK
        run: |
          v=$(grep -m1 'val appVersionName' app/build.gradle.kts | cut -d'"' -f2)
          cp app/build/outputs/apk/release/app-release.apk "MobileTokenSaver-$v.apk"
          echo "tag=mobile-v$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/mobile-v$v" >/dev/null; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/MobileTokenSaver-*.apk
      - name: Release
        if: github.ref == 'refs/heads/main' && steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%b -- . | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md || true
          [ -s notes.md ] || echo "MobileTokenSaver ${{ steps.v.outputs.tag }}" > notes.md
          gh release create --latest=false "${{ steps.v.outputs.tag }}" --target "$(git rev-parse HEAD)" --title "MobileTokenSaver ${{ steps.v.outputs.tag }}" --notes-file notes.md MobileTokenSaver-*.apk
